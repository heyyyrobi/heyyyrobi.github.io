<style>
  :root {
    --bg: #FFFFFF; --text: #3B2A1E; --label: #7A5638;
    --accent: #A67B5B; --strong: #8A6444;
    --card: #F6EFE7; --line: #E8DAC9;
    --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; padding-bottom: 104px; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 18px 20px 0; }
  .mark { margin: 0 0 14px; line-height: 0; }
  .mark svg { display: block; width: 48px; height: auto; fill: var(--accent); }

  .nav { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
         display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px;
         box-shadow: 0 10px 30px -12px rgba(59, 42, 30, 0.35); z-index: 5; }
  .nav a { display: block; padding: 10px 24px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--label); }
  .nav a[aria-current="page"] { background: var(--strong); color: #fff; }

  .title { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }

  .stage { perspective: 1400px; display: flex; justify-content: center; margin: 28px 0 10px; }
  .card { --w: min(calc(100vw - 40px), 460px); position: relative; width: var(--w); height: calc(var(--w) * 2 / 3.5);
          transform-style: preserve-3d; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .card:active { cursor: grabbing; }
  .card.snap { transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .face { position: absolute; inset: 0; border-radius: calc(var(--w) * 0.03); overflow: hidden; background: #fff;
          backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid var(--line);
          box-shadow: 0 22px 40px -22px rgba(59, 42, 30, 0.45); }

  .front .q { position: absolute; left: 4%; top: 6.25%; width: calc(var(--w) * 0.115); height: auto; fill: var(--accent); }
  .front .n { position: absolute; left: 4%; bottom: 6.25%; margin: 0; font-weight: 500; font-size: calc(var(--w) * 0.054); line-height: 1; color: var(--accent); }
  .front .strip { position: absolute; top: 0; right: 0; bottom: 0; width: 30%; background: var(--accent); display: flex; align-items: center; padding: 0 4%; }
  .front .strip p { margin: 0; color: #fff; font-weight: 700; font-size: calc(var(--w) * 0.033); line-height: 1.3; }

  .back { transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--w) * 0.012); }
  .back svg { height: 78%; width: auto; display: block; }
  .back p { margin: 0; font-style: italic; font-size: calc(var(--w) * 0.036); color: var(--label); }

  .hint { text-align: center; margin: 14px 0 0; font-size: 14px; color: var(--label); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .btn { appearance: none; border: 2px solid var(--strong); border-radius: 999px; padding: 13px 24px; font: 600 16px/1 var(--font); background: var(--strong); color: #fff; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--strong); }
  .toast { text-align: center; min-height: 24px; margin: 14px 0 0; font-size: 14px; color: var(--label); }

  .overlay { position: fixed; inset: 0; background: #fff; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; cursor: pointer; }
  .overlay[hidden] { display: none; }
  .overlay svg { width: min(88vw, 62vh); height: auto; display: block; }
  .overlay p { margin: 0; font-style: italic; color: var(--label); font-size: 17px; text-align: center; }
  .overlay small { color: var(--label); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { .card.snap { transition: none; } }

</style>

<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Flip card: tap or drag */
  var card = document.getElementById('card');
  var faces = card.querySelectorAll('.face');
  var angle = 0, flipped = false, startX = 0, startAngle = 0, down = false, moved = false;

  function setAngle(a, animate) {
    if (animate && !reduce) { card.classList.add('snap'); } else { card.classList.remove('snap'); }
    card.style.transform = 'rotateY(' + a + 'deg)';
    angle = a;
  }
  function sync() {
    card.setAttribute('aria-pressed', String(flipped));
    faces[0].setAttribute('aria-hidden', String(flipped));
    faces[1].setAttribute('aria-hidden', String(!flipped));
  }
  function toggle() { flipped = !flipped; setAngle(angle + 180, true); sync(); }
  function settle() {
    var a = ((angle % 360) + 360) % 360;
    var base = angle - a;
    var target = a < 90 ? base : (a < 270 ? base + 180 : base + 360);
    flipped = (((Math.round(target / 180)) % 2) + 2) % 2 === 1;
    setAngle(target, true);
    sync();
  }
  card.addEventListener('pointerdown', function (e) {
    down = true; moved = false; startX = e.clientX; startAngle = angle;
    card.classList.remove('snap');
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
  });
  card.addEventListener('pointermove', function (e) {
    if (!down) { return; }
    var dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 6) { moved = true; }
    if (moved) { setAngle(startAngle + dx * 0.7, false); }
  });
  card.addEventListener('pointerup', function () {
    if (!down) { return; }
    down = false;
    if (moved) { settle(); } else { toggle(); }
  });
  card.addEventListener('pointercancel', function () {
    if (!down) { return; }
    down = false;
    settle();
  });
  card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });
  if (!reduce) {
    setAngle(-80, false);
    requestAnimationFrame(function () { requestAnimationFrame(function () { setAngle(0, true); }); });
  }
  sync();

  /* Large QR */
  var overlay = document.getElementById('overlay');
  function openBig() { overlay.hidden = false; document.body.style.overflow = 'hidden'; }
  function closeBig() { overlay.hidden = true; document.body.style.overflow = ''; }
  document.getElementById('big-btn').addEventListener('click', openBig);
  overlay.addEventListener('click', closeBig);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeBig(); } });

  /* Share link */
  var toast = document.getElementById('toast');
  function say(msg) { toast.textContent = msg; setTimeout(function () { toast.textContent = ''; }, 2500); }
  document.getElementById('share').addEventListener('click', function () {
    var url = new URL('./', location.href).href;
    if (navigator.share) {
      navigator.share({ title: 'Robie on Queue', text: 'A full introduction, just a scan away.', url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { say('Link copied'); }, function () { say('Copy is not available here'); });
    } else {
      say('Copy is not available here');
    }
  });
})();
</script>
